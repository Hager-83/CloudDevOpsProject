name: Reusable Image Build

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVICE: ${{ inputs.service }}
      AWS_REGION: us-east-1
      REGISTRY: 211017377170.dkr.ecr.us-east-1.amazonaws.com

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set image reference
        shell: bash
        run: |
          set -euo pipefail

          case "$SERVICE" in
            auth-service|frontend|roadmap-service) ;;
            *) echo "Unknown service"; exit 1 ;;
          esac

          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE=$REGISTRY/ivolve/$SERVICE:$TAG" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" "app/$SERVICE"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          timeout: 10m

      - name: Inspect OIDC subject and audience
        shell: bash
        run: |
          python3 <<'OIDC'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps(
              {key: claims.get(key) for key in ("sub", "aud")},
              indent=2,
          ))
          OIDC

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::211017377170:role/ivolve-github-actions-role
          aws-region: us-east-1
          allowed-account-ids: "211017377170"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Push image to ECR
        run: docker push "$IMAGE"

      - name: Delete local image
        if: always() && env.IMAGE != ''
        run: docker image rm "$IMAGE" || true

      - name: Update Kubernetes manifest
        shell: bash
        run: |
          set -euo pipefail

          git switch main
          git pull --rebase origin main

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          service = os.environ["SERVICE"]
          image = os.environ["IMAGE"]
          path = Path("k8s") / f"{service}.yaml"
          original = path.read_text()

          updated, count = re.subn(
              r"(?m)^(\s*image:\s*)\S+\s*$",
              lambda match: match.group(1) + image,
              original,
          )

          if count != 1:
              raise SystemExit(
                  f"Expected one image entry in {path}; found {count}"
              )

          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "k8s/$SERVICE.yaml"
          git commit -m "Update $SERVICE image to $GITHUB_SHA"

      - name: Push manifest update
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              git pull --rebase origin main
            fi
          done

          echo "Failed to push manifest update after five attempts."
          exit 1
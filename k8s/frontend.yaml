apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ivolve
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 211017377170.dkr.ecr.us-east-1.amazonaws.com/ivolve/frontend:22586f101295faa005ea1075cf57df72bb37f036-44792574872-1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_SERVICE_URL
            - name: ROADMAP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ROADMAP_SERVICE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SESSION_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20